name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks（防密扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint（ruff check + format + mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 ruff 与 mypy
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format 校验
        run: ruff format --check .
      - name: Mypy 类型检查
        run: mypy .

  test:
    name: Test（pytest + 覆盖率门槛，Py ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest（覆盖率门槛 45%）
        run: pytest tests/ -v --cov=paper_check --cov=paper_grader --cov-report=term-missing --cov-fail-under=45
      - name: 上传覆盖率报告
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 14

  pip-audit:
    name: pip-audit（后端依赖已知漏洞）
    runs-on: ubuntu-latest
    continue-on-error: true   # 暂不阻塞，结果作为依赖周报输入
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
