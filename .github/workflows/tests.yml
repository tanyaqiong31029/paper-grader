name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks（防密扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint（ruff check + format + mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 ruff 与 mypy
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format 校验
        run: ruff format --check .
      - name: Mypy 类型检查
        run: mypy .

  test:
    name: Test（pytest + 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Pytest
        run: pytest tests/ -v --cov=paper_check --cov=paper_grader --cov-report=term-missing
