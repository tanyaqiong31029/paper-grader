# 本地提交安检（提交前自动运行，`pre-commit install` 安装）：
#   - 文件卫生：行尾空白 / 文件末尾换行 / YAML/TOML 语法 / 合并冲突标记 / 私钥检测
#   - ruff：lint --fix 与 format（与 CI、pyproject.toml 同一套规则）
#   - gitleaks：密钥泄露扫描（与 CI 的 gitleaks job 双保险）
# 全量历史扫描由 .github/workflows/tests.yml 的 gitleaks job 负责。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^corpus/.*\.txt$   # 语料库为原始文本数据，保持原样
      - id: end-of-file-fixer
        exclude: ^corpus/.*\.txt$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(paper_grader|paper_check|scripts|tests)/.*\.py$
      - id: ruff-format
        files: ^(paper_grader|paper_check|scripts|tests)/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
